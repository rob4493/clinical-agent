[build]
  base = "frontend"
  command = "npm run build"
  # Relative to base: the repository output is frontend/dist.
  publish = "dist"

[build.environment]
  NODE_VERSION = "24.21.0"

# Once the Python host has an assigned, verified HTTPS origin, insert this rule
# BEFORE the local /api fallback. Replace the marker; do not deploy it literally.
# [[redirects]]
#   from = "/api/*"
#   to = "<VERIFIED_BACKEND_ORIGIN>/:splat"
#   status = 200
#   force = true

# API failures must not be disguised as successful SPA HTML responses.
[[redirects]]
  from = "/api/*"
  to = "/backend-unavailable.json"
  status = 404
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/backend-unavailable.json"
  [headers.values]
    Cache-Control = "no-store"
