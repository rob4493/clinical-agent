[build]
  base = "."
  command = "npm --prefix frontend ci --ignore-scripts --no-audit --no-fund && npm --prefix frontend run build"
  publish = "frontend/dist"

[build.environment]
  NODE_VERSION = "24.21.0"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # Generated from the reviewed public allowlist; never original publications.
  included_files = ["netlify/RuntimeNotice.txt"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/evaluate/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

[dev]
  framework = "#static"
  publish = "frontend/dist"
  port = 8891
  autoLaunch = false
